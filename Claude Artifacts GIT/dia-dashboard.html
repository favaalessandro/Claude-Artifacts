<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>DIA – Dashboard di Navigazione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app a due pannelli. Barra laterale fissa (viste + gruppi di Dia per colore), area di lavoro a destra, scheda di dettaglio che scorre da destra, palette comandi al centro. */
:root {
  --bg: #f4f5f8; --side: #eceef3; --surface: #ffffff; --surface-2: #f6f7fa; --hover: #eef0f5; --line: #dfe2e9; --line-2: #cdd2dc;
  --fg: #15181e; --muted: #5d6573; --faint: #8b93a1;
  --ink: #15181e; --ink-fg: #ffffff; --focus: #2b59d9; --star: #c98a00;
  --ok: #1f8a52; --warn: #a86500; --bad: #c63b3b;
  --f-pin: #343a47; --f-blu: #2563c9; --f-viola: #7b4dcc; --f-verde: #1d8550; --f-arancione: #cf6410;
  --f-giallo: #a87e00; --f-rosso: #cc3838; --f-rosa: #c23f85; --f-neutro: #69717e;
  --shadow: 0 1px 2px rgba(20,24,30,.05), 0 8px 28px rgba(20,24,30,.08);
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --side-w: 264px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --side: #0b0d10; --surface: #171a21; --surface-2: #1c2028; --hover: #222731; --line: #272c36; --line-2: #363d4a;
  --fg: #e8ebf0; --muted: #9ba3b0; --faint: #6f7785; --ink: #e8ebf0; --ink-fg: #12151a; --focus: #7ea2ff; --star: #f0c04a;
  --ok: #4cc283; --warn: #e3a64a; --bad: #ff7b7b;
  --f-pin: #c9cfda; --f-blu: #6ea0ff; --f-viola: #b18dff; --f-verde: #4fc485; --f-arancione: #ff9b4d;
  --f-giallo: #e6c04d; --f-rosso: #ff7a7a; --f-rosa: #ff88c1; --f-neutro: #a5adba;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1115; --side: #0b0d10; --surface: #171a21; --surface-2: #1c2028; --hover: #222731; --line: #272c36; --line-2: #363d4a;
  --fg: #e8ebf0; --muted: #9ba3b0; --faint: #6f7785; --ink: #e8ebf0; --ink-fg: #12151a; --focus: #7ea2ff; --star: #f0c04a;
  --ok: #4cc283; --warn: #e3a64a; --bad: #ff7b7b;
  --f-pin: #c9cfda; --f-blu: #6ea0ff; --f-viola: #b18dff; --f-verde: #4fc485; --f-arancione: #ff9b4d;
  --f-giallo: #e6c04d; --f-rosso: #ff7a7a; --f-rosa: #ff88c1; --f-neutro: #a5adba;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font-body); overflow: hidden; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: 11.5px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
kbd { font: 500 11px var(--font-mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface); color: var(--muted); }

.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; }

/* Barra laterale */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.side-top { padding: 14px 12px 8px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.logo { width: 28px; height: 28px; border-radius: 8px; display: grid; grid-template-columns: repeat(2, 1fr); overflow: hidden; flex: none; }
.logo i { display: block; }
.brand h1 { font-size: 17px; font-weight: 700; line-height: 1.1; }
.brand small { display: block; font: 400 11.5px var(--font-body); color: var(--muted); letter-spacing: 0; }
.kbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; color: var(--muted); text-align: left; }
.kbtn:hover { border-color: var(--faint); }
.kbtn span { flex: 1; }
.side-scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 4px 8px 12px; }
.nav { display: grid; gap: 1px; }
.nav a, .gnav button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 7px; text-decoration: none; border: 0; background: none; text-align: left; color: var(--fg); min-width: 0; }
.nav a:hover, .gnav button:hover { background: var(--hover); }
.nav a[aria-current="page"], .gnav button[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.nav svg { flex: none; color: var(--muted); }
.nav a[aria-current="page"] svg { color: var(--fg); }
.cnt { margin-left: auto; font: 500 11px var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.side h2 { font: 600 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 8px 4px; display: flex; align-items: center; gap: 7px; }
.gnav button { font-size: 13.5px; padding-block: 5px; }
.gnav .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); flex: none; display: inline-block; }
.side-foot { border-top: 1px solid var(--line); padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.sync.on { background: var(--ok); } .sync.local { background: var(--warn); }

/* Area di lavoro */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface); min-height: 54px; }
.bar h2 { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.bar .sp { flex: 1; }
.iconbtn.menu { display: none; }
.content { flex: 1; overflow-y: auto; min-height: 0; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 48px 20px; }
.inner { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; min-width: 0; }
.view > * { min-width: 0; }
.view[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.iconbtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; border: 0; background: none; color: var(--faint); flex: none; text-decoration: none; }
.iconbtn:hover { background: var(--hover); color: var(--fg); }
.iconbtn.star[aria-pressed="true"] { color: var(--star); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line-2); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.chip .n { font: 500 11px var(--font-mono); opacity: .65; }
.kind { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.kind.k-aisv, .kind.k-ai { color: var(--f-arancione); } .kind.k-mine { color: var(--f-verde); } .kind.k-acc { color: var(--f-blu); }
.flag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; white-space: nowrap; color: var(--muted); background: var(--surface-2); }
.flag.w { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
.flag.e { color: var(--f-blu); background: color-mix(in srgb, var(--f-blu) 12%, transparent); }
.mono-tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; font: 600 12px var(--font-display); letter-spacing: .01em;
  background: color-mix(in srgb, var(--fam) 15%, var(--surface)); color: var(--fam); border: 1px solid color-mix(in srgb, var(--fam) 30%, transparent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.sec-h h3 { font-size: 15px; font-weight: 600; }
.sec-h .sp { flex: 1; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); font-size: 13.5px; }

/* Righe sito */
.rows { list-style: none; margin: 0; padding: 4px; }
.row { display: flex; align-items: center; gap: 4px; border-radius: 8px; padding-right: 4px; }
.row:hover { background: var(--hover); }
.row .body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; background: none; text-align: left; }
.row .tx { min-width: 0; flex: 1; display: grid; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { display: flex; gap: 6px; align-items: center; overflow: hidden; color: var(--faint); font-size: 12px; white-space: nowrap; }
.row .m .u { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .side-meta { display: flex; gap: 5px; align-items: center; flex: none; }

/* Home */
.hero { display: grid; gap: 12px; }
.hero h2 { font-size: 26px; font-weight: 600; }
.askbox { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.askbox input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 8px 0; }
.askbox input::placeholder { color: var(--faint); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px; }
.tile { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 4px 4px 4px 0; min-width: 0; }
.tile:hover { border-color: var(--line-2); }
.tile .go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 6px 7px 10px; text-decoration: none; }
.tile .tx { min-width: 0; display: grid; }
.tile .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .u { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 22px; align-items: start; }
.rcards { display: grid; gap: 8px; }
.rcard { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: left; width: 100%; }
.rcard:hover { border-color: var(--line-2); }
.rcard .tx { flex: 1; min-width: 0; }
.rcard .t { font-weight: 600; }
.rcard .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ring { --p: 0; width: 30px; height: 30px; border-radius: 50%; flex: none; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring::after { content: attr(data-l); width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 500 9.5px var(--font-mono); color: var(--muted); }

/* Guida */
.modes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stepper { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; font-size: 13px; color: var(--muted); }
.stepper b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--ink-fg); font: 600 11px var(--font-mono); margin-right: 6px; }
.stepper span { display: inline-flex; align-items: center; }
.stepper i { font-style: normal; color: var(--line-2); margin: 0 6px; }
.guide { display: grid; grid-template-columns: minmax(220px, 290px) minmax(0, 1fr); gap: 20px; align-items: start; }
.ilist { padding: 5px; display: grid; gap: 1px; }
.ilist button { text-align: left; border: 0; background: none; padding: 7px 9px; border-radius: 7px; display: flex; gap: 8px; align-items: center; }
.ilist button:hover { background: var(--hover); }
.ilist button[aria-current="true"] { background: var(--surface-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
.path h3.big { font-size: 22px; font-weight: 600; margin: 2px 0 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); }
.step .rank { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-mono); border: 1.5px solid var(--fam); color: var(--fam); }
.step.first { border-color: color-mix(in srgb, var(--fam) 45%, var(--line)); }
.step.first .rank { background: var(--fam); color: var(--surface); }
.step .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.step .head h4 { font-size: 15.5px; font-weight: 600; }
.step .why { margin: 3px 0 4px; }
.step .lim { font-size: 12.5px; color: var(--muted); margin-bottom: 9px; }
.step .lim b { color: var(--fg); font-weight: 600; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.gtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tip { margin-top: 12px; padding: 10px 13px; border-radius: var(--r); background: var(--surface-2); border: 1px dashed var(--line-2); font-size: 13px; }
.matches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.mlist { display: grid; gap: 5px; }
.mbtn { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.mbtn:hover { border-color: var(--faint); }
.mbtn .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mbtn .s { color: var(--faint); font-size: 12px; margin-left: auto; white-space: nowrap; }
.aibox { padding: 14px 16px; display: grid; gap: 10px; border-color: color-mix(in srgb, var(--f-arancione) 35%, var(--line)); }
.aibox .ans { white-space: pre-wrap; }

/* Mappa */
.filters { display: grid; gap: 8px; }
.filters .r { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.field { flex: 1 1 240px; min-width: 0; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.gsec > header { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--fam) 7%, var(--surface)); border-radius: var(--r) var(--r) 0 0; }
.gsec > header h3 { font-size: 14.5px; font-weight: 600; }
.gsec > header .num { font: 500 11px var(--font-mono); color: var(--fam); }
.glist { display: grid; gap: 14px; }

/* Confronta */
.cmp { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); gap: 20px; align-items: start; }
.tblwrap { overflow-x: auto; }
table.ct { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
.ct th, .ct td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ct thead th { border-bottom: 1px solid var(--line-2); min-width: 150px; }
.ct tbody th { font-weight: 600; color: var(--muted); font-size: 12px; width: 130px; min-width: 110px; }
.ct tbody tr:last-child th, .ct tbody tr:last-child td { border-bottom: 0; }
.ct .hd { display: grid; gap: 6px; }
.ct .hd .nm { display: flex; align-items: center; gap: 8px; font: 600 14px var(--font-display); }
.ct tr.sub th { color: var(--faint); }

/* Routine */
.rt { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
.rstep { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.rstep:last-child { border-bottom: 0; }
.rstep.next { background: color-mix(in srgb, var(--ok) 7%, transparent); }
.rstep.done .t { text-decoration: line-through; color: var(--muted); }
.rstep input { width: 16px; height: 16px; accent-color: var(--ok); }
.rstep .t { font-weight: 500; }
.rstep .u { font-size: 12.5px; color: var(--muted); }
.bar-p { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-p i { display: block; height: 100%; background: var(--ok); }

/* Pulizia */
.clean-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start; }
.clean-sec { padding: 6px 6px 8px; }
.clean-sec h3 { font-size: 14px; padding: 8px 10px 6px; display: flex; gap: 8px; align-items: center; }
.sev { width: 10px; height: 10px; border-radius: 2px; }
.citem { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 10px; border-radius: 7px; }
.citem:hover { background: var(--hover); }
.citem input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--ok); }
.citem .ct-t { font-weight: 600; }
.citem.done .ct-t { text-decoration: line-through; color: var(--muted); }
.citem p { margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); }
.linkish { border: 0; background: none; padding: 0; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

/* Scheda di dettaglio */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .38); z-index: 40; }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(470px, 100%); background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; box-shadow: var(--shadow);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) 22px; }
.drawer .dh { display: flex; gap: 12px; align-items: flex-start; }
.drawer .dh .mono-tile { width: 40px; height: 40px; font-size: 15px; border-radius: 10px; }
.drawer h2 { font-size: 20px; font-weight: 600; }

"Ogni giorno nuovi prodotti tech, app e strumenti AI votati dalla community.","n":"Molti lanci sono prodotti acerbi o operazioni di marketing: prova prima di adottarli."},{"id":"annas","t":"Anna's Archive (Shadow Libraries)","u":"https://shadowlibraries.neocities.org/DirectDownloads/AnnasArchive/","g":["libri"],"k":"ref","use":"Ultima risorsa, solo dopo aver controllato le fonti legali.","d":"Pagina di un sito terzo che elenca i mirror di Anna's Archive, un motore di ricerca per biblioteche ombra.","n":"Non è un servizio ufficiale né legale per le opere protette. I mirror cambiano spesso e alcuni possono avere pubblicità o file inaffidabili.","warn":"Molti file indicizzati violano il diritto d'autore: scaricare opere protette senza licenza è illecito in Italia."},{"id":"gplaybooks","t":"Google Play Libri","u":"https://play.google.com/books","g":["libri"],"k":"acc","use":"Acquisto e lettura di ebook, lettura dei tuoi PDF.","d":"Negozio di ebook e audiolibri. Puoi caricare anche i tuoi PDF ed EPUB e leggerli sincronizzati.","n":"Non apre i libri Kindle; il catalogo italiano è meno ampio di quello Amazon."},{"id":"mlol","t":"MLOL – Emilia Digital Library","u":"https://emilib.medialibrary.it/media/esplora.aspx","g":["libri"],"k":"acc","use":"Ebook e giornali gratis in prestito.","d":"Prestito digitale gratuito delle biblioteche emiliane: ebook, quotidiani e riviste, audiolibri, risorse open.","n":"Serve l'iscrizione a una biblioteca della rete. Gli ebook hanno code d'attesa, scadenze e un limite di prestiti al mese."},{"id":"poorcharlie","t":"Poor Charlie's Almanack (Stripe Press)","u":"https://www.stripe.press/poor-charlies-almanack","g":["libri"],"k":"ref","use":"Lettura su investimenti e modelli mentali.","d":"Edizione online del libro di Charlie Munger: discorsi e modelli mentali.","n":"L'edizione cartacea è a pagamento."},{"id":"gutenberg","t":"Project Gutenberg","u":"https://www.gutenberg.org/","g":["libri"],"k":"ref","use":"Classici gratuiti, soprattutto inglesi.","d":"Oltre 70.000 ebook di pubblico dominio, gratuiti in EPUB, Kindle e HTML.","n":"Solo opere fuori diritti, soprattutto in inglese: niente libri recenti."},{"id":"openlib","t":"Open Library","u":"https://openlibrary.org/","g":["libri"],"k":"ref","use":"Ricerca e prestito digitale.","d":"Catalogo di milioni di libri e prestito digitale delle copie scansionate da Internet Archive.","n":"Prestito a tempo con liste d'attesa; scansioni di qualità variabile, pochi titoli italiani recenti."},{"id":"liberliber","t":"Liber Liber","u":"https://liberliber.it/","g":["libri"],"k":"ref","use":"Classici italiani gratuiti.","d":"Classici italiani di pubblico dominio in ebook e audiolibri gratuiti.","n":"Solo opere libere da diritti: niente narrativa contemporanea."},{"id":"manybooks","t":"ManyBooks","u":"https://manybooks.net/search-book","g":["libri"],"k":"ref","use":"Ricerca di ebook liberi.","d":"Ebook gratuiti: classici e autori indipendenti, in vari formati.","n":"Per scaricare serve la registrazione; molti titoli autopubblicati sono di qualità variabile."},{"id":"arxiv","t":"arXiv","u":"https://arxiv.org/","g":["accad"],"k":"ref","use":"Ricerca recente in fisica, matematica, informatica e AI.","d":"Preprint ad accesso aperto di fisica, matematica, informatica, statistica ed economia quantitativa.","n":"Nessuna revisione tra pari: controlla se il paper è stato poi pubblicato. La ricerca interna è essenziale."},{"id":"nber","t":"NBER","u":"https://www.nber.org/","g":["accad"],"k":"ref","use":"Macroeconomia, politica monetaria, lavoro.","d":"Working paper di economia (macro, politica monetaria, lavoro, finanza), digest divulgativi e dati.","n":"Sono preprint non ancora revisionati."},{"id":"iascholar","t":"Internet Archive Scholar","u":"https://scholar.archive.org/","g":["accad"],"k":"ref","use":"Testi completi gratuiti e articoli datati.","d":"Ricerca nel testo completo di decine di milioni di articoli conservati da Internet Archive, anche di riviste scomparse.","n":"Copertura parziale delle riviste recenti; nessun grafo delle citazioni."},{"id":"gscholar","t":"Google Scholar","u":"https://scholar.google.com/","g":["accad"],"k":"ref","use":"Ricerca trasversale e studi di riferimento.","d":"Motore di ricerca accademico trasversale: articoli, libri, tesi, conteggio delle citazioni, “Citato da”, avvisi.","n":"Non filtra per qualità e non riassume; il testo completo spesso è a pagamento."},{"id":"acl","t":"ACL Anthology","u":"https://aclanthology.org/","g":["accad"],"k":"ref","use":"Ricerca su NLP e LLM.","d":"Archivio aperto dei paper delle conferenze di linguistica computazionale (ACL, EMNLP, NAACL…).","n":"Solo NLP: il machine learning generale sta su arXiv."},{"id":"ssrn","t":"SSRN eLibrary","u":"https://papers.ssrn.com/sol3/DisplayJournalBrowse.cfm","g":["accad"],"k":"ref","use":"Paper di finanza e scienze sociali.","d":"Preprint di economia, finanza, diritto e scienze sociali, in gran parte scaricabili gratis.","n":"Nessuna revisione tra pari; per alcuni download serve la registrazione."},{"id":"s2","t":"Semantic Scholar","u":"https://www.semanticscholar.org/","g":["accad"],"k":"ref","use":"Riassunti automatici e mappa delle citazioni.","d":"Ricerca accademica con AI: riassunti TLDR, grafo delle citazioni, citazioni “influenti”, lettore con spiegazioni.","n":"Copertura più debole per le scienze umane e per i paper in italiano."},{"id":"udemyaws","t":"Udemy – AWS Certified Machine Learning Specialty","u":"https://www.udemy.com/course/aws-machine-learning/learn/lecture/16368832#overview","g":["corsi"],"k":"learn","use":"Preparazione all'esame.","d":"Il corso video acquistato per la certificazione AWS ML Specialty, con quiz e prove d'esame.","n":"Non sostituisce la pratica sulla console. AWS ha ritirato diverse certificazioni Specialty: verifica che l'esame sia ancora attivo."},{"id":"awscost","t":"AWS Cost Management","u":"https://us-east-1.console.aws.amazon.com/costmanagement/home#/dashboards","g":["corsi"],"k":"acc","use":"Evitare d.edu/catalog?price%5B1%5D=1&modality%5BOnline%5D=Online&modality%5BOnlineLive%5D=OnlineLive","g":["corsi"],"k":"learn","use":"Corsi universitari gratuiti.","d":"Catalogo Harvard filtrato sui corsi online gratuiti (informatica, statistica, scienze umane).","n":"Il certificato è a pagamento; corsi in inglese."},{"id":"damodaran","t":"Damodaran Online","u":"https://pages.stern.nyu.edu/~adamodar/","g":["corsi"],"k":"learn","use":"Valutazione d'azienda (DCF, multipli).","d":"Lezioni, fogli di calcolo e dataset aggiornati ogni anno (costo del capitale, multipli di settore, rischio paese) di Aswath Damodaran.","n":"Sito spartano; i modelli sono in Excel e le ipotesi vanno adattate al caso."},{"id":"iaptcat","t":"IA per tutti – Catalogo corsi","u":"https://iapertutti.it/avamposto-dei-pionieri-corsi-e-risorse/index.php?track=sito","g":["corsi"],"k":"learn","use":"Formazione AI pratica in italiano.","d":"Catalogo di corsi e risorse pratiche sull'AI in italiano.","n":"Taglio pratico e divulgativo, non accademico. Verifica cosa è incluso nel tuo accesso."},{"id":"iaptfeed","t":"Avamposto dei pionieri – Feed","u":"https://academy.iapertutti.it/feed","g":["corsi"],"k":"acc","use":"Aggiornamenti e confronto con la community.","d":"Bacheca della community: post, domande e aggiornamenti dei membri.","n":"Non è un archivio ordinato dei contenuti."},{"id":"iaptstud","t":"Avamposto – Studiare con l'AI","u":"https://academy.iapertutti.it/c/imparare-qualsiasi-cosa-con-l-ai/","g":["corsi"],"k":"learn","use":"Metodo di studio con l'AI.","d":"Percorso su come usare l'AI per imparare qualsiasi argomento.","n":"È un metodo: va applicato con gli strumenti (Claude, Gemini Notebook, Recall)."},{"id":"aitidbits","t":"Reimagining Web Infrastructure for AI Agents","u":"https://www.aitidbits.ai/p/ai-agents-web-infrastructure","g":["corsi"],"k":"ref","use":"Lettura di approfondimento.","d":"Articolo su come il web si adatta agli agenti AI: protocolli e infrastruttura.","n":"Fotografa un momento preciso e invecchia in fretta."},{"id":"pytut","t":"Tutorial Python (it, 3.12)","u":"https://docs.python.org/it/3.12/tutorial/","g":["corsi"],"k":"learn","use":"Imparare Python.","d":"Il tutorial ufficiale di Python in italiano.","n":"Teoria senza esercizi interattivi; versione 3.12, non l'ultima."},{"id":"takeoff","t":"Takeoff – Mckay Wrigley","u":"https://www.jointakeoff.com/","g":["corsi"],"k":"learn","use":"Sviluppo assistito dall'AI.","d":"Corsi per costruire app usando l'AI come compagno di programmazione.","n":"In abbonamento; ritmo veloce, pensato per chi programma già un po'."},{"id":"karpathy","t":"Andrej Karpathy","u":"https://karpathy.ai/","g":["corsi"],"k":"learn","use":"Basi di deep learning e LLM.","d":"Sito di Andrej Karpathy: il corso video “Neural Networks: Zero to Hero”, progetti e post.","n":"Livello tecnico alto: servono Python e un po' di matematica."},{"id":"mlres","t":"Risorse ML","u":"https://ml-resources.vercel.app/","g":["corsi"],"k":"ref","use":"Trovare materiali di ML.","d":"Raccolta curata di link a risorse di machine learning.","n":"È un indice: niente contenuti propri né percorsi guidati."},{"id":"eureka","t":"Eureka Labs – materiali consigliati","u":"https://docs.google.com/spreadsheets/u/0/d/1515lE-AJsDAjyCxKE5eLjvhEcbau4ePJx9Cg6goSnns/htmlview","g":["corsi"],"k":"ref","use":"Piano di studio sull'AI.","d":"Foglio Google della community con risorse per studiare l'AI.","n":"Elenco senza ordine didattico; alcuni link possono essere obsoleti."},{"id":"lilearn","t":"LinkedIn Learning","u":"https://www.linkedin.com/learning/me","g":["corsi"],"k":"learn","use":"Competenze di business e tecnologia.","d":"Corsi professionali di business, software e AI, con certificati da mostrare sul profilo.","n":"Incluso in LinkedIn Premium o a pagamento; profondità limitata."},{"id":"feynman","t":"The Feynman Lectures on Physics","u":"https://www.feynmanlectures.caltech.edu/","g":["fisica"],"k":"learn","use":"Studio della fisica.","d":"Testo completo e gratui   const STOP = new Set("che chi con del della delle dei degli per una uno un il lo la le gli di da in su tra fra non come cosa devo devi voglio vorrei mio mia miei mie sul sulla nel nella dal dalla alla allo agli alle anche fare fatto fammi trovare sono essere avere ho hai the and for".split(" "));
  const SYN = { film: "guardare", serie: "guardare", canzoni: "musica", mail: "posta", email: "posta", soldi: "conto", azioni: "titoli", borsa: "mercati", azienda: "azienda", societa: "azienda",
    articoli: "paper", studi: "paper", ricerca: "paper", volo: "viaggio voli", aereo: "viaggio voli", albergo: "viaggio", vacanza: "viaggio", tasse: "fisco", multa: "patente", medico: "salute", dottore: "salute",
    codice: "programmare", programma: "programmare", app: "sviluppare", giornale: "notizie", news: "notizie", romanzo: "libro", ebook: "libro", chatbot: "assistente", gpt: "assistente", video: "guardare" };
  const stem = w => (w.length > 4 ? w.replace(/[aeiou]+$/, "") : w).slice(0, 7);
  const toks = s => { const out = []; norm(s).split(/[^a-z0-9]+/).forEach(w => { if (w.length > 2 && !STOP.has(w)) { out.push(stem(w)); if (SYN[w]) SYN[w].split(" ").forEach(x => out.push(stem(x))); } }); return out; };
  const pre = (a, b) => a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a));
  let intentIdx = [], siteIdx = [];
  function buildIndex() {
    intentIdx = D.intents.map(it => ({ it, strong: toks(it.t + " " + it.k), weak: toks(it.steps.map(st => st[1]).join(" ")) }));
    siteIdx = SITES.map(s => ({ s, strong: toks(s.t + " " + dom(s.u)), weak: toks([s.d, s.use, s.g.map(g => G[g].name).join(" ")].join(" ")) }));
  }
  function score(q, x) {
    let sc = 0;
    q.forEach(w => {
      if (x.strong.includes(w)) sc += 4; else if (x.strong.some(t => pre(t, w))) sc += 1.5;
      else if (x.weak.includes(w)) sc += 1; else if (x.weak.some(t => pre(t, w))) sc += 0.3;
    });
    return sc;
  }
  function search(raw, nI, nS) {
    const q = toks(raw); if (!q.length) return { its: [], ss: [] };
    const top = (idx, key, n) => idx.map(x => [score(q, x) + (key === "s" && isFav(x.s.id) ? 0.5 : 0), x[key]]).filter(a => a[0] >= 1).sort((a, b) => b[0] - a[0]).slice(0, n).map(a => a[1]);
    return { its: top(intentIdx, "it", nI), ss: top(siteIdx, "s", nS) };
  }
  const areaName = id => (D.areas.find(a => a[0] === id) || [, ""])[1];

  // ── Scheda di dettaglio e modifica ──
  let lastFocus = null;
  function openDrawer(html) { if ($("#drawer").hidden) lastFocus = document.activeElement; $("#drawer").innerHTML = html; $("#drawer").hidden = false; $("#scrim").hidden = false; $("#drawer").scrollTop = 0; }
  function closeDrawer() { $("#drawer").hidden = true; $("#scrim").hidden = true; UI.edit = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }

      ${cl.length ? `<section><h3>Da ripulire in Dia</h3>${cl.map(c => `<p>• <b>${esc(c.t)}</b> — ${esc(c.d)}</p>`).join("")}</section>` : ""}

    if (!keepFocus) { const a = $("#d-open"); if (a) a.focus(); }
  }
  function openEdit(id) {

      <div class="dh"><div style="flex:1"><div class="eyebrow">${id ? "Modifica sito" : "Nuovo sito"}</div><h2>${id ? esc(s.t) : "Aggiungi un sito alla mappa"}</h2></div><button class="iconbtn" type="button" data-act="close" aria-label="Chiudi">${ICON.x}</button></div>

          <label>Tipo<select id="e-k">${Object.entries(KIND).map(([k, l]) => `<option value="${k}" ${k === s.k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label></div>

          ${id && s.edited ? `<button class="btn ghost" type="button" data-act="edit-restore">Ripristina originale</button>` : ""}${id ? `<button class="btn ghost danger" type="button" data-act="edit-del">Elimina dalla mappa</button>` : ""}</div>

  function submitEdit() {

  // ── Palette ──
  let palItems = [], palSel = 0;
  function openPal() { lastFocus = document.activeElement; $("#pal").hidden = false; $("#scrim").hidden = false; $("#pal-q").value = ""; renderPal(); $("#pal-q").focus(); }

    const raw = $("#pal-q").value.trim(), q = norm(raw); palItems = [];
    const add = (label, items) => { if (items.length) { palItems.push({ head: label }); items.forEach(i => palItems.push(i)); } };
    const siteItem = s => ({ type: "site", id: s.id, l: s.t, s: dom(s.u), ic: tile(s) });
    if (!q) {
      add("Preferiti", P.favs.map(id => SITE[id]).filter(Boolean).slice(0, 6).map(siteItem));
      add("Recenti", P.recent.map(id => SITE[id]).filter(Boolean).filter(s => !isFav(s.id)).slice(0, 5).map(siteItem));

      const direct = SITES.filter(s => norm(s.t + " " + dom(s.u)).includes(q)).sort((a, b) => (norm(b.t).startsWith(q) - norm(a.t).startsWith(q)) || (isFav(b.id) - isFav(a.id)));
      const res = search(raw, 4, 8);
      const ss = [...direct, ...res.ss.filter(s => !direct.includes(s))].slice(0, 9);
      add("Siti", ss.map(siteItem));
      add("Percorsi", res.its.map(i => ({ type: "intent", id: i.id, l: i.t, s: areaName(i.area), ic: `<span class="ic">${vicon(VIEWS[1][2])}</span>` })));
      add("Gruppi", D.groups.filter(g => norm(g.name).includes(q)).slice(0, 4).map(g => ({ type: "group", id: g.id, l: g.name, s: "Gruppo", ic: `<span class="ic"><span class="dot" style="--fam:${famVar(g.fam)}"></span></span>` })));
      add("Confronti e routine", [...D.compares.filter(c => norm(c.t + " " + c.q).includes(q)).map(c => ({ type: "cmp", id: c.id, l: c.t, s: "Confronto", ic: `<span class="ic">${vicon(VIEWS[3][2])}</span>` })),
        ...routines().filter(r => norm(r.t).includes(q)).map(r => ({ type: "routine", id: r.id, l: r.t, s: "Routine", ic: `<span class="ic">${vicon(VIEWS[4][2])}</span>` }))]);
      if (!palItems.length) palItems.push({ head: "Nessun risultato. Prova la Guida con una frase più lunga." });
    }

  }
  function drawPal() {
    $("#pal-l").innerHTML = palItems.map((i, n) => i.head ? `<li class="gl" role="presentation">${esc(i.head)}</li>` : `<li role="option" data-pi="${n}" aria-selected="${n === palSel}">${i.ic}<span class="l">${esc(i.l)}</span><span class="s">${esc(i.s)}</span></li>`).join("");

  }
  function runPal(n) {

    closePal();
    if (i.type === "site") openSite(i.id);
    else if (i.type === "view") go(i.id);
    else if (i.type === "intent") pickIntent(i.id);
    else if (i.type === "group") { UI.group = i.id; go("mappa", true); }
    else if (i.type === "cmp") { UI.cmp = i.id; go("confronta", true); }
    else if (i.type === "routine") { UI.routine = i.id; go("routine", true); }
  }

  // ── Viste e instradamento ──
  const RENDER = { home: renderHome, guida: renderGuida, mappa: renderMappa, confronta: renderConfronta, routine: renderRoutine, pulizia: renderPulizia };
  function renderAll() {
    renderSide();
    VIEWS.forEach(([id]) => { $("#v-" + id).hidden = id !== UI.view; });
    RENDER[UI.view]();
    const g = UI.view === "mappa" && UI.group ? G[UI.group] : null;
    $("#bar-t").textContent = g ? g.name : VIEWS.find(v => v[0] === UI.view)[1];
    $("#bar-s").textContent = { home: SITES.length + " siti · " + (D.groups.length - 1) + " gruppi · " + D.intents.length + " percorsi", guida: "Tre modi per arrivare al sito giusto", mappa: g ? FAM[g.fam][0] : "Tutti i gruppi di Dia, per colore", confronta: "Alternative a confronto", routine: "Sequenze di schede da aprire in ordine", pulizia: "Doppioni, schede rotte e cose da verificare" }[UI.view];
    $("#btn-add").hidden = false;
  }
  function go(v, force) {
    closeSide();

  }
  function closeSide() { $("#side").classList.remove("open"); if ($("#drawer").hidden && $("#pal").hidden) $("#scrim").hidden = true; }
  function pickIntent(id) { const it = D.intents.find(i => i.id === id); if (!it) return; UI.intent = id; UI.area = it.area; if (!$("#drawer").hidden) closeDrawer(); go("guida", true); const p = $("#path"); if (p) p.scrollIntoView({ block: "start" }); }
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (RENDER[h] && h !== UI.view) { UI.view = h; if (h !== "mappa") UI.group = null; renderAll(); $("#content").scrollTop = 0; } });

  function toggleFav(id) { const i = P.favs.indexOf(id); i >= 0 ? P.favs.splice(i, 1) : P.favs.unshift(id); savePrefs(); }
  function addRecent(id) { P.recent = [id, ...P.recent.filter(x => x !== id)].slice(0, 20); savePrefs(); }

  // ── Eventi ──
  document.addEventListener("click", e => {
    const t = e.target;
    const a = t.closest("a[data-open]");
    if (a) { addRecent(a.dataset.open); if (a.dataset.rtick) tick(a.dataset.rtick, a.dataset.open, true); setTimeout(() => { if (UI.view === "home" || UI.view === "routine") renderAll(); }, 60); return; }
    const pi = t.closest("[data-pi]"); if (pi) return runPal(+pi.dataset.pi);

    if (d.pref) { UI.pref = d.pref; return renderGuida(); }
    if (d.ex) { UI.need = d.ex; UI.ai = null; return renderGuida(); }
    if (d.kind) { UI.kinds.has(d.kind) ? UI.kinds.delete(d.kind) : UI.kinds.add(d.kind); return renderMappa(); }
    if (d.cmp) { UI.cmp = d.cmp; return renderConfronta(); }

    if (d.radd) { mutRoutines(rs => { const r = rs.find(x => x.id === d.radd); if (r && !r.s.includes(d.sid)) r.s.push(d.sid); }); toast("Aggiunto alla routine."); renderAll(); return openSite(d.sid, true); }

      case "palette": return openPal();
      case "menu": $("#side").classList.toggle("open"); $("#scrim").hidden = !$("#side").classList.contains("open"); return;
      case "close": return closeDrawer();

      case "edit-del": { const id = UI.edit; E[id] = BASE[id] ? { del: 1 } : null; if (!BASE[id]) delete E[id]; saveEdit(id); P.favs = P.favs.filter(x => x !== id); savePrefs(); rebuild(); closeDrawer(); renderAll(); return toast("Sito tolto dalla mappa."); }

    else if (t.id === "cmp-add" && t.value) { addCmp(t.value); renderConfronta(); }
    else if (t.id === "r-add" && t.value) { mutRoutines(rs => { const r = rs.find(x => x.id === UI.routine); if (r) r.s.push(t.value); }); renderAll(); }
    else if (d.ck) { t.checked ? P.done.push(d.ck) : (P.done = P.done.filter(x => x !== d.ck)); savePrefs(); renderAll(); }
    else if (d.rcheck) { tick(UI.routine, d.rcheck, t.checked); renderAll(); }
  });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""));
    if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return $("#pal").hidden ? openPal() : closePal(); }
    if (e.key === "/" && !typing && $("#pal").hidden) { e.preventDefault(); return openPal(); }
    if (!$("#pal").hidden) {
      if (e.key === "Escape") { closePal(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const dir = e.key === "ArrowDown" ? 1 : -1; let n = palSel; for (let k = 0; k < palItems.length; k++) { n = (n + dir + palItems.length) % palItems.length; if (!palItems[n].head) break; } palSel = n; return drawPal(); }
      if (e.key === "Enter") { e.preventDefault(); return runPal(palSel); }
      return;
    }
    if (e.key === "Escape") { if (!$("#drawer").hidden) return closeDrawer(); if ($("#side").classList.contains("open")) { $("#side").classList.remove("open"); $("#scrim").hidden = true; } }
  });

  // ── Avvio ──
  rebuild();
  const h0 = location.hash.slice(1); if (RENDER[h0]) UI.view = h0;
  renderAll();
  const C = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if (!C) setSync("local");
  else {
    C.use("sample").then(s => { if (s) { sample = s; if (UI.view === "guida") renderGuida(); } }).catch(() => {});
    C.use("db").then(async d => {
      if (!d) return setSync("local");
      try {
        const [pd, ed] = await Promise.all([d.doc("dia/prefs").get(), d.collection("edits").get()]);
        if (pd.exists) { const v = pd.data() || {}; P = Object.assign({ favs: [], recent: [], done: [], routines: null, day: "", ticks: {} }, v); ["favs", "recent", "done"].forEach(k => { if (!Array.isArray(P[k])) P[k] = []; }); if (!Array.isArray(P.routines)) P.routines = null; if (!P.ticks || typeof P.ticks !== "object") P.ticks = {}; }
        const remote = {}; ed.docs.forEach(x => { const v = x.data(); if (v && (v.del || v.site)) remote[x.id] = v; });
        const localOnly = !pd.exists && !ed.docs.length;
        db = d;
        if (localOnly) { if (P.favs.length || P.done.length || P.routines) savePrefs(); Object.keys(E).forEach(saveEdit); }
        else { E = remote; ls.set("dia2-edits", E); ls.set("dia2-prefs", P); }
        setSync("on"); rebuild();
        if ($("#drawer").hidden && $("#pal").hidden && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "")) renderAll(); else renderSide();
      } catch (e) { setSync("local"); }
    }).catch(() => setSync("local"));
    setTimeout(() => { if (syncMode === "wait") setSync("local"); }, 11000);
  }
})();
</script>
