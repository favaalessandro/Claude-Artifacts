<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>DIA – Dashboard di Navigazione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superiore fissa con viste (Guida · Mappa · Pulizia); i gruppi di Dia restano riconoscibili dal loro colore in ogni vista. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f8f9fb; --line: #e1e4ea; --fg: #14171d; --muted: #5c6472;
  --ink: #14171d; --ink-fg: #ffffff; --focus: #2b59d9;
  --ok: #1f8a52; --warn: #a86500; --bad: #c63b3b;
  --f-pin: #2a2f3a; --f-blu: #2563c9; --f-viola: #7b4dcc; --f-verde: #1d8550; --f-arancione: #cf6410;
  --f-giallo: #a87e00; --f-rosso: #cc3838; --f-rosa: #c23f85; --f-neutro: #69717e;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1014; --surface: #161920; --surface-2: #1b1f27; --line: #282d37; --fg: #e8ebf0; --muted: #9ba3b0;
  --ink: #e8ebf0; --ink-fg: #12151a; --focus: #7ea2ff; --ok: #4cc283; --warn: #e3a64a; --bad: #ff7b7b;
  --f-pin: #d5dae3; --f-blu: #6ea0ff; --f-viola: #b18dff; --f-verde: #4fc485; --f-arancione: #ff9b4d;
  --f-giallo: #e6c04d; --f-rosso: #ff7a7a; --f-rosa: #ff88c1; --f-neutro: #a5adba; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #161920; --surface-2: #1b1f27; --line: #282d37; --fg: #e8ebf0; --muted: #9ba3b0;
  --ink: #e8ebf0; --ink-fg: #12151a; --focus: #7ea2ff; --ok: #4cc283; --warn: #e3a64a; --bad: #ff7b7b;
  --f-pin: #d5dae3; --f-blu: #6ea0ff; --f-viola: #b18dff; --f-verde: #4fc485; --f-arancione: #ff9b4d;
  --f-giallo: #e6c04d; --f-rosso: #ff7a7a; --f-rosa: #ff88c1; --f-neutro: #a5adba; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 14.5px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Barra superiore */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font-size: 21px; font-weight: 700; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.spectrum { display: flex; height: 6px; width: 84px; border-radius: 3px; overflow: hidden; flex: none; align-self: center; }
.spectrum i { flex: 1; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs a { text-decoration: none; padding: 6px 14px; border-radius: 999px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--ink-fg); }
.tabs a .n { font-family: var(--font-mono); font-size: 11px; opacity: .8; margin-left: 4px; }
.stats { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }

main { padding-block: 22px 60px; }
.view[hidden] { display: none !important; }

/* Guida */
.ask { display: grid; gap: 10px; margin-bottom: 22px; }
.ask label { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.ask .row { position: relative; }
.ask input { width: 100%; font: 400 17px/1.4 var(--font-body); padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.ask input::placeholder { color: var(--muted); }
.ask .hint { font-size: 13px; color: var(--muted); }
.ask .hint button { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--fg); }
.matches { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.matches[hidden] { display: none !important; }
.matches h3 { font-size: 13px; margin-bottom: 8px; }
.mlist { display: grid; gap: 6px; }
.mbtn { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.mbtn:hover { border-color: var(--muted); }
.mbtn .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }

.areas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.chip .n { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
.guide { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 22px; align-items: start; }
.intents { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.intent { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.intent:hover { background: var(--surface-2); }
.intent[aria-current="true"] { background: var(--surface-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
.intent .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.path { min-width: 0; }
.path header { margin-bottom: 14px; }
.path h2 { font-size: 26px; font-weight: 600; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); }
.step .rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font-mono); border: 1.5px solid var(--fam, var(--muted)); color: var(--fam, var(--muted)); }
.step:first-child { border-color: color-mix(in srgb, var(--fam) 45%, var(--line)); }
.step:first-child .rank { background: var(--fam); color: var(--surface); }
.step .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.step .head h3 { font-size: 16.5px; font-weight: 600; }
.step .why { margin: 4px 0 6px; }
.step .lim { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.step .lim b { font-weight: 600; color: var(--fg); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.tip { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); border: 1px dashed var(--line); font-size: 13.5px; }
.tip b { font-family: var(--font-display); }

/* Etichette di gruppo */
.gtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); flex: none; display: inline-block; }
.kind { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.kind.k-aisv, .kind.k-ai { color: var(--f-arancione); border-color: color-mix(in srgb, var(--f-arancione) 35%, var(--line)); }
.kind.k-mine { color: var(--f-verde); border-color: color-mix(in srgb, var(--f-verde) 35%, var(--line)); }
.kind.k-acc { color: var(--f-blu); border-color: color-mix(in srgb, var(--f-blu) 35%, var(--line)); }
.flag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.flag.w { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.flag.p { color: var(--muted); background: var(--surface-2); }

/* Mappa */
.filters { display: grid; gap: 10px; margin-bottom: 18px; }
.filters .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .lab { font-size: 12px; color: var(--muted); width: 70px; flex: none; }
.filters input[type="search"] { flex: 1 1 260px; min-width: 0; font: 400 14.5px var(--font-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.fam-chip[aria-pressed="true"] { background: color-mix(in srgb, var(--fam) 16%, var(--surface)); border-color: var(--fam); color: var(--fg); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.resultline { font-size: 13px; color: var(--muted); }
.fam-block { margin-top: 22px; }
.fam-block > h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--fam); }
.fam-block > h2 .muted { font-weight: 400; font-family: var(--font-body); font-size: 13px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; align-items: start; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.group > header { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; background: color-mix(in srgb, var(--fam) 9%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--fam) 25%, var(--line)); }
.group > header h3 { font-size: 14.5px; font-weight: 600; }
.group > header .num { font-family: var(--font-mono); font-size: 11px; color: var(--fam); font-weight: 500; }
.group > header .c { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.sites { list-style: none; margin: 0; padding: 4px; }
.site { display: flex; align-items: center; gap: 6px; border-radius: 7px; }
.site:hover { background: var(--surface-2); }
.site .open-d { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 7px 8px; cursor: pointer; display: grid; gap: 1px; }
.site .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site .meta { display: flex; gap: 6px; align-items: center; overflow: hidden; }
.site .dom { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.site .go { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; text-decoration: none; color: var(--muted); margin-right: 4px; }
.site .go:hover { background: var(--line); color: var(--fg); }
.empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* Pulizia */
.clean-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 30px; margin-bottom: 18px; }
.clean-head h2 { font-size: 26px; font-weight: 600; }
.progress { flex: 1 1 240px; display: grid; gap: 6px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.clean-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; align-items: start; }
.clean-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 6px 8px; }
.clean-sec h3 { font-size: 14.5px; padding: 8px 10px 6px; display: flex; gap: 8px; align-items: center; }
.clean-sec h3 .sev { width: 10px; height: 10px; border-radius: 2px; }
.citem { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-radius: 7px; }
.citem:hover { background: var(--surface-2); }
.citem input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--ok); }
.citem .ct { font-weight: 600; }
.citem.done .ct { text-decoration: line-through; color: var(--muted); }
.citem p { margin: 2px 0 4px; font-size: 13px; color: var(--muted); }
.citem .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.linkish { border: 0; background: none; padding: 0; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--fg); }

/* Scheda di dettaglio */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .35); z-index: 40; }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px; box-shadow: -12px 0 40px rgba(0,0,0,.12); }
.drawer .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; }
.drawer h2 { font-size: 22px; font-weight: 600; padding-right: 40px; }
.drawer .url { word-break: break-all; color: var(--muted); margin: 6px 0 10px; }
.drawer .tags { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
.drawer section { margin-top: 16px; }
.drawer section h3 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 600; margin-bottom: 4px; }
.drawer section p { margin: 0; }
.alert { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; background: color-mix(in srgb, var(--warn) 11%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.linkrow { display: grid; gap: 6px; }
.linkrow a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; text-decoration: none; }
.linkrow a:hover { border-color: var(--muted); }
.mini { display: flex; flex-wrap: wrap; gap: 6px; }
.mini button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.mini button:hover { border-color: var(--muted); }

footer.foot { border-top: 1px solid var(--line); padding-block: 18px 30px; font-size: 12.5px; color: var(--muted); }
footer.foot p { margin: 0 0 6px; max-width: 80ch; }

@media (max-width: 860px) {
  .guide { grid-template-columns: minmax(0, 1fr); }
  .intents { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .matches { grid-template-columns: minmax(0, 1fr); }
  .tabs { margin-left: 0; }
  .ask label { font-size: 22px; }
  .drawer { top: auto; height: 86%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="spectrum" aria-hidden="true" id="spectrum"></span>
      <h1>DIA <span>· Dashboard di Navigazione</span></h1>
    </div>
    <nav class="tabs" aria-label="Viste">
      <a href="#guida" data-view="guida">Guida</a>
      <a href="#mappa" data-view="mappa">Mappa <span class="n" id="n-map"></span></a>
      <a href="#pulizia" data-view="pulizia">Pulizia <span class="n" id="n-clean"></span></a>
    </nav>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-guida" aria-label="Guida">
    <div class="ask">
      <label for="need">Cosa devi fare?</label>
      <div class="row"><input id="need" type="search" autocomplete="off" placeholder="Es. trovare un libro gratis, analizzare un'azienda, pagare il bollo…"></div>
      <div class="hint" id="hint"></div>
      <div class="matches" id="matches" hidden>
        <div><h3>Percorsi adatti</h3><div class="mlist" id="m-intents"></div></div>
        <div><h3>Siti pertinenti</h3><div class="mlist" id="m-sites"></div></div>
      </div>
    </div>
    <div class="areas" id="areas" role="group" aria-label="Aree"></div>
    <div class="guide">
      <div class="intents" id="intents" role="list"></div>
      <article class="path" id="path" aria-live="polite"></article>
    </div>
  </section>

  <section class="view" id="v-mappa" aria-label="Mappa" hidden>
    <div class="filters">
      <div class="row"><input id="q" type="search" placeholder="Cerca per nome, dominio o funzione" autocomplete="off"><span class="resultline" id="resultline"></span></div>
      <div class="row" id="f-fam" role="group" aria-label="Colore"><span class="lab">Colore</span></div>
      <div class="row" id="f-kind" role="group" aria-label="Tipo"><span class="lab">Tipo</span></div>
      <div class="row"><span class="lab">Mostra</span>
        <label class="toggle"><input type="checkbox" id="f-warn"> solo schede con avvisi o da ripulire</label>
        <label class="toggle"><input type="checkbox" id="f-multi"> solo siti presenti in più gruppi</label>
      </div>
    </div>
    <div id="map"></div>
  </section>

  <section class="view" id="v-pulizia" aria-label="Pulizia" hidden>
    <div class="clean-head">
      <div><div class="eyebrow">Da sistemare in Dia</div><h2>Pulizia delle schede</h2></div>
      <div class="progress"><span class="muted" id="c-prog"></span><div class="bar"><i id="c-bar"></i></div></div>
    </div>
    <div class="clean-cols" id="clean"></div>
  </section>
</main>

<footer class="foot"><div class="wrap" id="foot"></div></footer>

<script>
(function () {
  const D = JSON.parse(document.getElementById("dia-data").textContent);

    pin: ["Fissate", "--f-pin"], blu: ["Conoscenza e studio", "--f-blu"], viola: ["Discipline umanistiche", "--f-viola"],

    rosso: ["Salute", "--f-rosso"], rosa: ["Svago", "--f-rosa"], neutro: ["Servizi e comunicazione", "--f-neutro"],
  };

  const G = Object.fromEntries(D.groups.map(g => [g.id, g]));
  const SITE = Object.fromEntries(D.sites.map(s => [s.id, s]));
  const cleanBySite = {};
  D.cleanup.forEach(c => c.s.forEach(id => (cleanBySite[id] = cleanBySite[id] || []).push(c)));
  const intentsBySite = {};
  D.intents.forEach(it => it.steps.forEach(([id]) => (intentsBySite[id] = intentsBySite[id] || []).push(it)));

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const famVar = fam => `var(${FAM[fam][1]})`;
  const mainGroup = s => G[s.g.find(g => g !== "pin") || s.g[0]];
  const dom = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const hasWarn = s => !!(s.warn || (cleanBySite[s.id] || []).some(c => c.sev !== "dup"));
  const isDup = s => (cleanBySite[s.id] || []).some(c => c.sev === "dup");
  const ICON_OUT = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V10M9 2h5v5M14 2 7.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ── Intestazione ──
  $("#spectrum").innerHTML = FAM_ORDER.filter(f => f !== "pin").map(f => `<i style="background:${famVar(f)}"></i>`).join("");
  const nGroups = D.groups.filter(g => g.id !== "pin").length;
  const nAI = D.sites.filter(s => s.k === "ai" || s.k === "aisv").length;
  $("#stats").innerHTML = `<span><b>${D.sites.length}</b> siti unici</span><span><b>${nGroups}</b> gruppi</span><span><b>${D.intents.length}</b> percorsi</span><span><b>${nAI}</b> AI e chat salvate</span>`;
  $("#n-map").textContent = D.sites.length;
  $("#n-clean").textContent = D.cleanup.length;
  $("#foot").innerHTML =
    `<p>Mappa costruita sull'elenco delle schede esportato da Dia l'11/11/2026. Descrizioni di funzioni e limiti scritte a partire dalla conoscenza dei servizi, non verificate sito per sito: piani, prezzi e funzioni cambiano.</p>` +

  // ── Scheda di dettaglio ──
  let lastFocus = null;
  function siteMini(id) {
    const s = SITE[id]; if (!s) return "";
    return `<button type="button" data-site="${s.id}"><span class="dot" style="--fam:${famVar(mainGroup(s).fam)}"></span>${esc(s.t)}</button>`;
  }

    const cl = cleanBySite[s.id] || [];

      <section><h3>Cosa non fa · limiti</h3><p>${esc(s.n)}</p></section>
      <section><h3>Usalo per</h3><p>${esc(s.use)}</p></section>
      ${s.links ? `<section><h3>Schede unificate</h3><div class="linkrow">${s.links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><span>${esc(l)}</span>${ICON_OUT}</a>`).join("")}</div></section>` : ""}
      ${cl.length ? `<section><h3>Da ripulire</h3>${cl.map(c => `<p>• <b>${esc(c.t)}</b> — ${esc(c.d)}</p>`).join("")}</section>` : ""}
      ${its.length ? `<section><h3>Compare nei percorsi</h3><div class="mini">${its.map(it => `<button type="button" data-intent="${it.id}">${esc(it.t)}</button>`).join("")}</div></section>` : ""}
      ${alt.length ? `<section><h3>Alternative per gli stessi bisogni</h3><div class="mini">${alt.map(siteMini).join("")}</div></section>` : ""}`;
    $("#drawer").hidden = false; $("#scrim").hidden = false;
    $("#drawer .close").focus();
  }
  function closeSite() {
    $("#drawer").hidden = true; $("#scrim").hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("#scrim").addEventListener("click", closeSite);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden) closeSite(); });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-site],[data-intent],[data-close]");
    if (!b) return;
    if (b.hasAttribute("data-close")) return closeSite();
    if (b.dataset.site) return openSite(b.dataset.site);
    if (b.dataset.intent) { closeSite(); selectIntent(b.dataset.intent, true); }
  });

  // ── Guida ──
  const firstIntent = D.intents[0];
  let curArea = firstIntent.area, curIntent = firstIntent.id;
  function renderAreas() {
    $("#areas").innerHTML = D.areas.map(([id, name]) => {
      const n = D.intents.filter(i => i.area === id).length;
      return n ? `<button type="button" class="chip" data-area="${id}" aria-pressed="${id === curArea}">${esc(name)} <span class="n">${n}</span></button>` : "";
    }).join("");
  }
  function renderIntents() {
    $("#intents").innerHTML = D.intents.filter(i => i.area === curArea).map(i =>
      `<button type="button" class="intent" role="listitem" data-pick="${i.id}" aria-current="${i.id === curIntent}">${esc(i.t)}<span class="cnt">${i.steps.length}</span></button>`).join("");
  }
  function renderPath() {
    const it = D.intents.find(i => i.id === curIntent);
    const areaName = (D.areas.find(a => a[0] === it.area) || [, ""])[1];
    const steps = it.steps.filter(([id]) => SITE[id]).map(([id, why], i) => {
      const s = SITE[id], g = mainGroup(s);
      const label = i === 0 ? "Prima scelta" : "";
      return `<li class="step" style="--fam:${famVar(g.fam)}">
        <span class="rank" aria-hidden="true">${i + 1}</span>
        <div>
          <div class="head"><h3>${esc(s.t)}</h3>${label ? `<span class="eyebrow">${label}</span>` : ""}
            <span class="gtag"><span class="dot"></span>${g.id === "pin" ? "Fissata" : esc(g.name)}</span><span class="kind k-${s.k}">${esc(KIND[s.k])}</span></div>
          <p class="why">${esc(why)}</p>
          <p class="lim"><b>Limiti:</b> ${esc(s.n)}</p>
          ${s.warn ? `<p class="lim" style="color:var(--warn)">${esc(s.warn)}</p>` : ""}
          <div class="actions"><a class="btn primary" href="${esc(s.u)}" target="_blank" rel="noopener">Apri ${ICON_OUT}</a><button type="button" class="btn" data-site="${s.id}">Dettagli</button></div>
        </div></li>`;
    }).join("");
    $("#path").innerHTML = `<header><div class="eyebrow">${esc(areaName)} · percorso consigliato</div><h2>${esc(it.t)}</h2></header>
      <ol class="steps">${steps}</ol>${it.tip ? `<div class="tip"><b>Consiglio.</b> ${esc(it.tip)}</div>` : ""}`;
  }
  function selectIntent(id, scroll) {
    const it = D.intents.find(i => i.id === id); if (!it) return;
    curIntent = id; curArea = it.area;
    store.set("dia-intent", id);
    if (location.hash !== "#guida") location.hash = "guida"; else show("guida");
    renderAreas(); renderIntents(); renderPath();
    if (scroll) $("#path").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  $("#areas").addEventListener("click", e => {
    const b = e.target.closest("[data-area]"); if (!b) return;
    curArea = b.dataset.area; curIntent = D.intents.find(i => i.area === curArea).id;
    renderAreas(); renderIntents(); renderPath();
  });
  $("#intents").addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (b) selectIntent(b.dataset.pick, matchMedia("(max-width: 860px)").matches); });

  // Ricerca per bisogno: confronto per radici di parola
  const STOP = new Set("che chi con del della delle dei degli per una uno un il lo la le gli di da in su tra fra non come cosa devo devi voglio vorrei mio mia miei mie sul sulla nel nella dal dalla alla allo agli alle anche fare fatto fammi trovare sono essere avere ho hai the and for".split(" "));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const toks = s => norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => (w.length > 4 ? w.replace(/[aeiou]+$/, "") : w).slice(0, 7));
  const intentIdx = D.intents.map(it => ({ it, strong: toks(it.t + " " + it.k), weak: toks(it.steps.map(st => st[1]).join(" ")) }));
  const siteIdx = D.sites.map(s => ({ s, strong: toks(s.t + " " + dom(s.u)), weak: toks([s.d, s.use || "", s.g.map(g => G[g].name).join(" ")].join(" ")) }));
  const pre = (a, b) => a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a));
  function score(q, x) {
    let sc = 0;
    q.forEach(w => {
      if (x.strong.includes(w)) sc += 4; else if (x.strong.some(t => pre(t, w))) sc += 1.5;
      else if (x.weak.includes(w)) sc += 1; else if (x.weak.some(t => pre(t, w))) sc += 0.3;
    });
    return sc;
  }
  function runNeed() {
    const raw = $("#need").value.trim(); const q = toks(raw);
    if (!q.length) { $("#matches").hidden = true; return; }
    const its = intentIdx.map(x => [score(q, x), x.it]).filter(a => a[0] >= 1).sort((a, b) => b[0] - a[0]).slice(0, 5);
    const ss = siteIdx.map(x => [score(q, x), x.s]).filter(a => a[0] >= 1).sort((a, b) => b[0] - a[0]).slice(0, 6);
    const areaName = id => (D.areas.find(a => a[0] === id) || [, ""])[1];
    $("#m-intents").innerHTML = its.length ? its.map(([, it]) => `<button type="button" class="mbtn" data-intent="${it.id}">${esc(it.t)}<span class="sub">${esc(areaName(it.area))}</span></button>`).join("") : `<p class="muted">Nessun percorso corrisponde. Prova con altre parole o scegli un'area qui sotto.</p>`;
    $("#m-sites").innerHTML = ss.length ? ss.map(([, s]) => `<button type="button" class="mbtn" data-site="${s.id}"><span class="dot" style="--fam:${famVar(mainGroup(s).fam)}"></span>${esc(s.t)}<span class="sub">${esc(dom(s.u))}</span></button>`).join("") : `<p class="muted">Nessun sito corrisponde.</p>`;
    $("#matches").hidden = false;
  }
  $("#need").addEventListener("input", runNeed);
  const EXAMPLES = ["leggere un libro gratis", "analizzare un'azienda", "pagare il bollo auto", "trovare paper scientifici", "notizie di oggi"];
  $("#hint").innerHTML = "Prova: " + EXAMPLES.map(x => `<button type="button" data-ex="${esc(x)}">${esc(x)}</button>`).join(" · ");
  $("#hint").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) { $("#need").value = b.dataset.ex; runNeed(); } });

  // ── Mappa ──
  const fFam = new Set(), fKind = new Set();
  $("#f-fam").insertAdjacentHTML("beforeend", FAM_ORDER.filter(f => D.groups.some(g => g.fam === f)).map(f =>
    `<button type="button" class="chip fam-chip" data-fam="${f}" aria-pressed="false" style="--fam:${famVar(f)}"><span class="dot"></span>${esc(FAM[f][0])}</button>`).join(""));
  $("#f-kind").insertAdjacentHTML("beforeend", Object.entries(KIND).filter(([k]) => D.sites.some(s => s.k === k)).map(([k, l]) =>
    `<button type="button" class="chip" data-kind="${k}" aria-pressed="false">${esc(l)} <span class="n">${D.sites.filter(s => s.k === k).length}</span></button>`).join(""));
  function toggleSet(set, v, btn) { set.has(v) ? set.delete(v) : set.add(v); btn.setAttribute("aria-pressed", set.has(v)); renderMap(); }
  $("#f-fam").addEventListener("click", e => { const b = e.target.closest("[data-fam]"); if (b) toggleSet(fFam, b.dataset.fam, b); });
  $("#f-kind").addEventListener("click", e => { const b = e.target.closest("[data-kind]"); if (b) toggleSet(fKind, b.dataset.kind, b); });
  ["#q", "#f-warn", "#f-multi"].forEach(s => $(s).addEventListener("input", renderMap));

  function siteRow(s, g) {
    const others = s.g.filter(x => x !== g.id && x !== "pin").length;
    const flags = [
      s.g.includes("pin") && g.id !== "pin" ? `<span class="flag p">${s.loose ? "Sciolta" : "Fissata"}</span>` : "",
      others ? `<span class="flag p">+${others} ${others > 1 ? "gruppi" : "gruppo"}</span>` : "",
      hasWarn(s) ? `<span class="flag w">Avviso</span>` : "",
      isDup(s) ? `<span class="flag p">Doppione</span>` : "",
      s.links ? `<span class="flag p">${s.links.length} schede</span>` : "",
    ].join("");
    return `<li class="site"><button type="button" class="open-d" data-site="${s.id}"><span class="t">${esc(s.t)}</span>
      <span class="meta"><span class="kind k-${s.k}">${esc(KIND[s.k])}</span>${flags}<span class="dom">${esc(dom(s.u))}</span></span></button>
      <a class="go" href="${esc(s.u)}" target="_blank" rel="noopener" aria-label="Apri ${esc(s.t)}">${ICON_OUT}</a></li>`;
  }
  function renderMap() {
    const q = norm($("#q").value.trim()), onlyWarn = $("#f-warn").checked, onlyMulti = $("#f-multi").checked;
    const ok = s => (!fKind.size || fKind.has(s.k)) && (!onlyWarn || hasWarn(s) || isDup(s)) && (!onlyMulti || s.g.length > 1)
      && (!q || norm([s.t, s.u, s.d, s.n, s.use || ""].join(" ")).includes(q));
    const seen = new Set(); let html = "";
    FAM_ORDER.forEach(f => {
      if (fFam.size && !fFam.has(f)) return;
      const blocks = D.groups.filter(g => g.fam === f).map(g => {
        const list = D.sites.filter(s => s.g.includes(g.id) && ok(s));
        if (!list.length) return "";
        list.forEach(s => seen.add(s.id));
        return `<section class="group" style="--fam:${famVar(f)}"><header>${g.id === "pin" ? "" : `<span class="num">${g.n}</span>`}<h3>${esc(g.name)}</h3><span class="c">${list.length}</span></header><ul class="sites">${list.map(s => siteRow(s, g)).join("")}</ul></section>`;
      }).join("");
      if (blocks) html += `<div class="fam-block" style="--fam:${famVar(f)}"><h2><span class="dot"></span>${esc(FAM[f][0])} <span class="muted">· ${f === "pin" ? "fuori dai gruppi" : "gruppi " + esc(f)}</span></h2><div class="groups">${blocks}</div></div>`;
    });
    $("#map").innerHTML = html || `<div class="empty">Nessun sito con questi filtri.</div>`;
    $("#resultline").textContent = `${seen.size} di ${D.sites.length} siti`;
  }

  // ── Pulizia ──
  let done = new Set(store.get("dia-cleanup-v1", []));
  function renderClean() {
    $("#clean").innerHTML = Object.entries(SEV).map(([sev, [name, col]]) => {
      const items = D.cleanup.filter(c => c.sev === sev); if (!items.length) return "";
      return `<section class="clean-sec"><h3><span class="sev" style="background:var(${col})"></span>${esc(name)} <span class="muted mono">${items.length}</span></h3>
        ${items.map(c => `<div class="citem ${done.has(c.id) ? "done" : ""}"><input type="checkbox" id="ck-${c.id}" data-ck="${c.id}" ${done.has(c.id) ? "checked" : ""}>
          <div><label for="ck-${c.id}" class="ct">${esc(c.t)}</label><p>${esc(c.d)}</p>
          <div class="refs">${c.s.filter(id => SITE[id]).map(id => `<button type="button" class="linkish" data-site="${id}">${esc(SITE[id].t)}</button>`).join(" · ")}</div></div></div>`).join("")}</section>`;
    }).join("");
    const n = D.cleanup.filter(c => done.has(c.id)).length;
    $("#c-prog").textContent = `${n} di ${D.cleanup.length} sistemate`;
    $("#c-bar").style.width = (100 * n / D.cleanup.length) + "%";
  }
  $("#clean").addEventListener("change", e => {
    const id = e.target.dataset.ck; if (!id) return;
    e.target.checked ? done.add(id) : done.delete(id);
    store.set("dia-cleanup-v1", [...done]); renderClean();
  });

  // ── Viste ──
  function show(v) {
    ["guida", "mappa", "pulizia"].forEach(x => { $("#v-" + x).hidden = x !== v; });
    document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
  }
  function route() { const h = location.hash.slice(1); show(["guida", "mappa", "pulizia"].includes(h) ? h : "guida"); }
  window.addEventListener("hashchange", route);

  const saved = store.get("dia-intent", null);
  if (saved && D.intents.some(i => i.id === saved)) { curIntent = saved; curArea = D.intents.find(i => i.id === saved).area; }
  renderAreas(); renderIntents(); renderPath(); renderMap(); renderClean(); route();
})();
</script>

</body>
</html>
